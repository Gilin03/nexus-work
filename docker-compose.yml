services:
  mysql:
    image: mysql:8.4
    container_name: nexus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set in .env}
      NEXUS_APP_PASSWORD: ${NEXUS_APP_PASSWORD:?set in .env}
      NEXUS_CONF_PASSWORD: ${NEXUS_CONF_PASSWORD:?set in .env}
    ports:
      # 기본은 로컬 루프백만 노출. n8n 장비가 DB 에 붙어야 하는 PC 만 .env 에 DB_BIND=0.0.0.0 을 두고,
      # 반드시 Windows 방화벽 차단 규칙으로 n8n 장비 외의 접속을 막는다(docs/03_팀_연동안내.md "n8n DB 접속").
      # 호스트 및 컨테이너 내부 포트 모두 3307 통일
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-3307}:3307"
    volumes:
      - ./db/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./db/schema.sql:/seed/schema.sql:ro
      - ./db/grants.sql:/seed/grants.sql:ro
      - nexus-mysql-data:/var/lib/mysql
    command: ["--port=3307", "--local-infile=0", "--secure-file-priv=NULL"]

volumes:
  nexus-mysql-data:
