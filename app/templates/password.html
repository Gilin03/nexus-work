{% extends "base.html" %}
{% block title %}비밀번호 변경 · NEXUS WORK{% endblock %}
{% block content %}
<h1>비밀번호 변경</h1>
<div class="sheet narrow">
  <p class="hint">12자 이상, 대문자·소문자·숫자·특수문자 중 3가지 이상, 아이디 포함 금지.</p>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.change_password') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>현재 비밀번호
      <input type="password" name="current_password" autocomplete="current-password" required maxlength="256">
    </label>
    <label>새 비밀번호
      <input type="password" name="new_password" autocomplete="new-password" required maxlength="128">
    </label>
    <label>새 비밀번호 확인
      <input type="password" name="confirm_password" autocomplete="new-password" required maxlength="128">
    </label>
    <button type="submit" class="btn primary">변경</button>
  </form>
</div>
{% endblock %}
