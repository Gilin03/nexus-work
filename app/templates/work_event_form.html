{% extends "base.html" %}
{% block title %}일정 등록 · NEXUS WORK{% endblock %}
{% block content %}
<a class="crumb" href="{{ url_for('work.calendar') }}">&larr; 일정</a>
<h1>일정 등록</h1>
<div class="sheet narrow">
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('work.event_new') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>제목 <input name="title" required maxlength="100" value="{{ values.get('title', '') }}"></label>
    <label>시작일 (YYYY-MM-DD) <input name="start_date" required maxlength="10" pattern="\d{4}-\d{2}-\d{2}" value="{{ values.get('start_date', '') }}"></label>
    <label>종료일 (비우면 시작일과 같음) <input name="end_date" maxlength="10" pattern="\d{4}-\d{2}-\d{2}" value="{{ values.get('end_date', '') }}"></label>
    <label class="check"><input type="checkbox" name="all_day" value="1"{% if values.get('all_day') %} checked{% endif %}> 종일</label>
    <label>시작 시각 (HH:MM) <input name="start_time" maxlength="5" pattern="([01]\d|2[0-3]):[0-5]\d" placeholder="10:00" value="{{ values.get('start_time', '') }}"></label>
    <label>종료 시각 (HH:MM) <input name="end_time" maxlength="5" pattern="([01]\d|2[0-3]):[0-5]\d" placeholder="11:00" value="{{ values.get('end_time', '') }}"></label>
    <label>장소 <input name="location" maxlength="100" value="{{ values.get('location', '') }}"></label>
    <label>내용 <textarea name="description" rows="4" maxlength="1000">{{ values.get('description', '') }}</textarea></label>
    <label>공개 범위
      <select name="scope">{% for key, label in scopes.items() %}<option value="{{ key }}"{% if values.get('scope', 'team') == key %} selected{% endif %}>{{ label }}</option>{% endfor %}</select>
    </label>
    <label>참석자 (여러 명 선택 가능, 최대 30명)
      <select name="attendees" multiple size="8">
        {% for u in users if u.id != g.user.id %}<option value="{{ u.id }}"{% if u.id|string in values.get('attendees', []) %} selected{% endif %}>{{ u.display_name }} ({{ u.dept }})</option>{% endfor %}
      </select>
    </label>
    <p class="hint">참석자로 지정된 사람은 공개 범위와 상관없이 이 일정을 볼 수 있습니다. 나만 보기 일정은 관리자도 볼 수 없습니다.</p>
    <div class="actions"><button type="submit" class="btn primary">등록</button></div>
  </form>
</div>
{% endblock %}
