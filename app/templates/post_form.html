{% extends "base.html" %}
{% block title %}글쓰기 · {{ name }}{% endblock %}
{% block content %}
<a class="crumb" href="{{ url_for('portal.board_list', board=board) }}">&larr; {{ name }}</a>
<h1>{{ name }} 글쓰기</h1>
<div class="sheet">
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('portal.post_new', board=board) }}" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>제목
      <input name="title" required maxlength="120">
    </label>
    <label>내용
      <textarea name="body" required maxlength="5000" rows="8"></textarea>
    </label>
    <label>첨부 (선택, 여러 개 가능 · 형식·개수·용량 제한 없음) — 내용 칸에 그림·파일을 붙여넣기(Ctrl+V)하거나 끌어다 놓아도 됩니다
      <input type="file" name="attachment" id="attachment" multiple>
    </label>
    <div id="attach-preview" class="attach-preview" hidden></div>
    <button type="submit" class="btn primary">등록</button>
  </form>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='paste-attach.js') }}" defer></script>{% endblock %}
