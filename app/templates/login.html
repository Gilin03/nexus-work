{% extends "base.html" %}
{% block title %}로그인 · NEXUS WORK{% endblock %}
{% block content %}
<div class="sheet">
  <h1>로그인</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('auth.login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>아이디
      <input name="username" autocomplete="username" required maxlength="32" autofocus>
    </label>
    <label>비밀번호
      <input type="password" name="password" autocomplete="current-password" required maxlength="256">
    </label>
    <button type="submit" class="btn primary">로그인</button>
  </form>
</div>
{% endblock %}
